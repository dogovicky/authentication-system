services:
  postgres-test:
    image: postgres:16-alpine
    container_name: auth-test-postgres
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: auth_test_db
    ports:
      - "5433:5432"   # Different port to avoid conflict with dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d auth_test_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s

  kafka-test:
    image: apache/kafka:3.7.0
    container_name: auth-test-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-test:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-test:9093'
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    ports:
      - "9094:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-test:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 5

  auth-system-test:
    env_file:
      - docker.env.test
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: auth-test-app
    depends_on:
      postgres-test:
        condition: service_healthy
      kafka-test:
        condition: service_healthy

volumes:
  postgres_test_data: