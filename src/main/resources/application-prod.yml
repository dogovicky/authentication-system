# application-prod.yml
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false  # ← false in prod, migrations must be clean

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false  # ← no SQL logs in prod

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVER}
    consumer:
      auto-offset-reset: earliest
      properties:
        spring:
          json:
            trusted:
              packages: "*"

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: email, profile
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: user:email, read:user

  data:
    redis:
      host: ${SPRING_REDIS_HOST:redis}
      port: 6379

app:
  oauth2:
    redirect-uri: ${APP_OAUTH2_REDIRECT_URI}
  jwt:
    secret: ${JWT_SECRET}

kafka:
  topics:
    email-verification: email-verification-topic
    email-verification-dlt: email-verification-topic-dlt
    otp-verification: otp-verification-topic
    otp-verification-dlt: otp-verification-topic-dlt
    password-reset: password-reset-topic
    password-reset-dlt: password-reset-topic-dlt
    welcome-email: welcome-email-topic
  groups:
    email-verification: group-email-verification
    email-verification-dlt: group-email-verification-dlt
    otp-verification: group-otp-verification
    otp-verification-dlt: group-otp-verification-dlt
    password-reset: group-password-reset
    password-reset-dlt: group-password-reset-dlt
    welcome-email: group-welcome-email

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      access: UNRESTRICTED
    health:
      show-details: always
  metrics:
    tags:
      application: auth-service

logging:
  level:
    root: info
    ke.co.legalbridge: info  # ← no debug in prod