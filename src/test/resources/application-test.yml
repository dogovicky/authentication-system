spring:
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: email, profile

          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: user:email, read:user

  jackson:
    deserialization:
      fail-on-unknown-properties: false

  kafka:
    producer:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVER}
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable:
          idempotence: false
        max:
          block:
            ms: 5000
        request:
          timeout:
            ms: 5000

    consumer:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVER}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring:
          json:
            trusted:
              packages: "*"


  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: false
    baseline-on-migrate: true
    locations: classpath:db/migration
    user: ${DB_USER}
    password: ${DB_PASSWORD}
    url: ${DB_URL}
    schemas: public

  thymeleaf:
    cache: false
    mode: HTML
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    prometheus:
      access: UNRESTRICTED

springdoc:
  swagger-ui:
    enabled: true

logging:
  level:
    web: debug
    root: info

    org:
      springframework:
        security:
          config:
            annotation:
              authentication:
                configuration:
                  InitializeUserDetailsBeanManagerConfigurer: ERROR
      hibernate:
        SQL: DEBUG


        orm:
          jdbc:
            bind: trace

kafka:
  topics:
    email-verification: email-verification-topic
    email-verification-dlt: email-verification-topic-dlt
    otp-verification: otp-verification-topic
    otp-verification-dlt: otp-verification-topic-dlt
    password-reset: password-reset-topic
    password-reset-dlt: password-reset-topic-dlt
    welcome-email: welcome-email-topic

  groups:
    email-verification: group-email-verification
    email-verification-dlt: group-email-verification-dlt
    otp-verification: group-otp-verification
    otp-verification-dlt: group-otp-verification-dlt
    password-reset: group-password-reset
    password-reset-dlt: group-password-reset-dlt
    welcome-email: group-welcome-email

resend:
  api-key: ${RESEND_API_KEY}
  from: onboarding@resend.dev


app:
  oauth2:
    redirect-uri: ${FRONT_END_URL}/oauth2/callback

  jwt:
    secret: ${JWT_SECRET}